---
name: Visual

# Visual-regression + PDF-render gate. Runs in the pinned Playwright image
# (mcr.microsoft.com/playwright:v1.61.1-noble) so CI rendering matches the committed baselines
# exactly (same OS + fonts) — the #1 cause of snapshot flake is cross-environment font rendering.
# Baselines are generated in the same image via `make visual-update`; a missing baseline fails here
# because CI never passes --update-snapshots. See docs/ci-cd.md.
#
# The image ships Node + the pinned Chromium but not `make`, so the build step calls the underlying
# `npm run build` (what `make page` wraps) directly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    name: Visual + PDF checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build the site (HTML + PDF)
        # Pin the build's "Last update" date so the date baked into the PDF (which the PDF-visual
        # spec rasterises and diffs) is stable. Must match VISUAL_SOURCE_DATE_EPOCH in the Makefile
        # (2026-07-03 12:00 UTC → "July 3, 2026") so `make visual` / `make visual-update` and CI agree.
        run: npm run build
        env:
          SOURCE_DATE_EPOCH: '1783080000'

      - name: Run visual + PDF checks
        run: npx playwright test

      - name: Upload Playwright report + diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

---
name: Deploy

# Build dist/ in CI (Node 22 + the lockfile-pinned Playwright Chromium) and deploy the
# prebuilt output to Vercel with `make deploy`. Vercel's own git build is disabled
# (vercel.json -> git.deploymentEnabled: false), so this workflow is the sole deploy
# path: push to main -> production; pull_request -> preview. See docs/ci-cd.md.
#
# Requires: secret VERCEL_TOKEN; repository variables VERCEL_ORG_ID + VERCEL_PROJECT_ID.
# Fork PRs do not receive secrets, so the deploy step fails there (no publish) — expected
# for this single-maintainer repo, where branches are pushed to the repo itself.

on:
  push:
    branches: [main]
  pull_request:

# One in-flight deploy per ref; a newer push / PR update supersedes the older run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # Cache only the browser binaries; --with-deps below still reinstalls apt libs each run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the site (HTML + PDF)
        run: make page

      # make deploy prints only the deployment URL on stdout (pull/build go to stderr).
      # The Vercel CLI is a pinned devDependency from `npm ci` above; make deploy runs `npx vercel`.
      - name: Deploy to Vercel
        id: deploy
        run: |
          set -o pipefail
          # Capture make deploy's real exit code (a command substitution discards it otherwise) and
          # fail on it — don't infer success purely from the URL match below.
          if [ "${{ github.event_name }}" = "push" ]; then
            out="$(make deploy PROD=1)"; rc=$?
          else
            out="$(make deploy)"; rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::make deploy failed (exit $rc)"
            printf '%s\n' "$out"
            exit "$rc"
          fi
          # Extract the deployment URL by pattern rather than trusting the last stdout line, so a
          # stray CLI line/warning can't be captured as the "URL". Fail loudly if none is found — the
          # PR-surfacing step below is also gated on this output being non-empty.
          url="$(printf '%s\n' "$out" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n1 || true)"
          if [ -z "$url" ]; then
            echo "::error::No Vercel deployment URL found in 'make deploy' output"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      # Surface the preview URL on the PR (the CLI-only setup has no Vercel bot comment). Two
      # surfaces, both tied to the head commit so they can't look stale:
      #   1. A GitHub Deployment + status → shows in the PR's "Deployments" box and on the commit,
      #      updated per commit (an edited-in-place comment alone is silent and gets buried).
      #   2. A single upserted comment, stamped with the short SHA + time so an in-place edit is
      #      unmistakably current.
      # Gated on a non-empty deploy URL (the Deploy step exits non-zero otherwise, skipping this).
      - name: Surface the preview on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const sha = context.payload.pull_request.head.sha
            const shortSha = sha.slice(0, 7)
            const env = `preview-pr-${issue_number}`

            // 1) Native surface: a Deployment tied to the head commit → shows in the PR's
            // "Deployments" box and on the commit. required_contexts: [] so it never waits on other
            // checks. We explicitly mark the previous preview inactive so only the current commit's
            // deployment stays active — `auto_inactive` does NOT apply to transient environments, so
            // it can't do this for us. Non-fatal: a deployment hiccup must not fail the deploy or
            // block the comment below.
            try {
              const before = await github.rest.repos.listDeployments({
                owner, repo, environment: env, per_page: 100
              })
              const prevId = before.data.length ? Math.max(...before.data.map((d) => d.id)) : null

              const dep = await github.rest.repos.createDeployment({
                owner, repo, ref: sha, environment: env,
                transient_environment: true, auto_merge: false, required_contexts: [],
                description: `Vercel preview for ${shortSha}`
              })
              if (dep.data && dep.data.id) {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: dep.data.id, state: 'success',
                  environment: env, environment_url: url, log_url: url,
                  description: `Vercel preview for ${shortSha}`
                })
                // Retire the prior preview for this PR so only the latest stays active.
                if (prevId) {
                  await github.rest.repos.createDeploymentStatus({
                    owner, repo, deployment_id: prevId, state: 'inactive',
                    description: `Superseded by ${shortSha}`
                  })
                }
              } else {
                core.warning(`createDeployment returned no id: ${JSON.stringify(dep.data)}`)
              }
            } catch (e) {
              core.warning(`Could not publish deployment status: ${e.message}`)
            }

            // 2) Conversation surface: one upserted comment, stamped so it's obviously live.
            const marker = '<!-- vercel-preview -->'
            const stamp = `${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`
            const body = [
              marker,
              `🔺 **Vercel preview:** ${url}`,
              '',
              `<sub>commit \`${shortSha}\` · updated ${stamp}</sub>`
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
